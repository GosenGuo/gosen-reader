plugins {
    id "com.android.application"
}

android {
    namespace "com.gosen.reader"
    compileSdk 35

    defaultConfig {
        applicationId "com.gosen.reader"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "0.1.1"

        def feedUrl = project.findProperty("CONTENT_FEED_URL") ?: ""
        buildConfigField "String", "CONTENT_FEED_URL", "\"${feedUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
