plugins {
    id "com.android.application"
}

android {
    namespace "com.gosen.reader"
    compileSdk 35

    defaultConfig {
        applicationId "com.gosen.reader"
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(project.findProperty("VERSION_CODE") ?: "2")
        versionName project.findProperty("VERSION_NAME") ?: "0.1.1"

        def feedUrl = project.findProperty("CONTENT_FEED_URL") ?: ""
        def updateManifestUrl = project.findProperty("UPDATE_MANIFEST_URL")
                ?: "https://gosenguo.github.io/gosen-reader/app-update.json"
        def contentRefillUrl = project.findProperty("CONTENT_REFILL_URL") ?: ""
        def contentRefillToken = project.findProperty("CONTENT_REFILL_TOKEN") ?: ""
        buildConfigField "String", "CONTENT_FEED_URL", "\"${feedUrl}\""
        buildConfigField "String", "UPDATE_MANIFEST_URL", "\"${updateManifestUrl}\""
        buildConfigField "String", "CONTENT_REFILL_URL", "\"${contentRefillUrl}\""
        buildConfigField "String", "CONTENT_REFILL_TOKEN", "\"${contentRefillToken}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        stableRelease {
            def releaseStoreFile = project.findProperty("RELEASE_STORE_FILE")
            if (releaseStoreFile) {
                storeFile file(releaseStoreFile)
                storePassword project.findProperty("RELEASE_STORE_PASSWORD") ?: ""
                keyAlias project.findProperty("RELEASE_KEY_ALIAS") ?: ""
                keyPassword project.findProperty("RELEASE_KEY_PASSWORD") ?: ""
            }
        }
    }

    buildTypes {
        debug {
            if (project.findProperty("RELEASE_STORE_FILE")) {
                signingConfig signingConfigs.stableRelease
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
