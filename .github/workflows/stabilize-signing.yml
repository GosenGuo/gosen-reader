name: Apply stable Android signing

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/stabilize-signing.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply signing configuration atomically
        shell: bash
        env:
          BUILD_GRADLE_BASE64: ""
          APP_RELEASE_WORKFLOW_BASE64: ""
        run: |
          printf '%s' "$BUILD_GRADLE_BASE64" | base64 --decode > app/build.gradle
          printf '%s' "$APP_RELEASE_WORKFLOW_BASE64" | base64 --decode > .github/workflows/app-release.yml
          git rm .github/workflows/stabilize-signing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle .github/workflows/app-release.yml
          git commit -m "fix: use a stable Android signing key"
          git push
