name: Build and publish Android update

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/app-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-app-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore the app signing key
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret ANDROID_DEBUG_KEYSTORE_BASE64 is missing"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Choose a monotonically increasing version
        shell: bash
        run: |
          echo "VERSION_CODE=$(($(date +%s) / 60))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=0.2.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=app-v0.2.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Build the signed APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug \
            -PVERSION_CODE="$VERSION_CODE" \
            -PVERSION_NAME="$VERSION_NAME" \
            -PCONTENT_FEED_URL="https://gosenguo.github.io/gosen-reader/articles.json" \
            -PUPDATE_MANIFEST_URL="https://gosenguo.github.io/gosen-reader/app-update.json" \
            -PCONTENT_REFILL_URL="${{ vars.CONTENT_REFILL_URL }}" \
            -PCONTENT_REFILL_TOKEN="${{ secrets.CONTENT_REFILL_TOKEN }}"
          cp app/build/outputs/apk/debug/app-debug.apk "GosenReader-${VERSION_NAME}.apk"

      - name: Publish the APK and update manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_NAME="GosenReader-${VERSION_NAME}.apk"
          APK_SHA256="$(sha256sum "$APK_NAME" | cut -d ' ' -f 1)"
          gh release create "$RELEASE_TAG" "$APK_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Gosen Reader ${VERSION_NAME}" \
            --notes "自动构建版本 ${VERSION_NAME}。安装时请按安卓系统提示确认。"
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${APK_NAME}"
          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg apkUrl "$APK_URL" \
            --arg sha256 "$APK_SHA256" \
            --arg releaseNotes "新版 ${VERSION_NAME} 已发布，包含最新功能和问题修复。" \
            '{versionCode:$versionCode,versionName:$versionName,apkUrl:$apkUrl,sha256:$sha256,releaseNotes:$releaseNotes}' \
            > docs/app-update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/app-update.json
          git commit -m "release: Android ${VERSION_NAME}"
          git push
