name: Monthly content update

on:
  push:
    branches: ["main"]
    paths:
      - "updater/**"
      - ".github/workflows/monthly-update.yml"
  workflow_dispatch:
    inputs:
      target_count:
        description: "Number of articles for a manual test/update"
        required: true
        default: "3"
  schedule:
    - cron: "20 2 1 * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: monthly-content-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'schedule' && 180 || 30 }}
    env:
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_BASE_URL: ${{ vars.AI_BASE_URL || 'https://xcode.best/v1' }}
      AI_MODEL: ${{ vars.AI_MODEL || 'deepseek-v4-pro' }}
      AI_FALLBACK_MODELS: ${{ vars.AI_FALLBACK_MODELS || 'gemini-2.5-flash' }}
      SEARCH_PROVIDER: github-code
      GITHUB_SEARCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET_ARTICLE_COUNT: ${{ github.event_name == 'schedule' && '30' || github.event_name == 'push' && '1' || inputs.target_count }}
      MAX_SEARCH_RESULTS: ${{ github.event_name == 'schedule' && '80' || '20' }}
      MAX_CANDIDATE_ATTEMPTS: ${{ github.event_name == 'schedule' && '40' || github.event_name == 'push' && '3' || '10' }}
      CONTENT_SEED: ${{ github.run_id }}
      RACE_DIR: /tmp/RACE
      OUTPUT_PATH: ../docs/articles.json
      WORD_BANK_PATH: ../docs/word-bank.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Ensure relay secret exists
        shell: bash
        run: |
          if [ -z "$AI_API_KEY" ]; then
            echo "::error::Repository secret AI_API_KEY is missing"
            exit 1
          fi

      - name: Download the official RACE high-school exam dataset
        shell: bash
        run: |
          curl --fail --location --retry 3 --retry-all-errors \
            https://www.cs.cmu.edu/~glai1/data/race/RACE.tar.gz \
            --output /tmp/RACE.tar.gz
          tar -xzf /tmp/RACE.tar.gz -C /tmp
          test -d /tmp/RACE/train/high

      - name: Generate and validate monthly package
        working-directory: updater
        run: |
          node src/run.mjs
          node src/check.mjs ../docs/articles.json ../docs/word-bank.json

      - name: Commit the validated package
        if: >-
          github.event_name != 'push' ||
          contains(github.event.head_commit.message, '[publish-one-article]')
        id: content_commit
        shell: bash
        run: |
          if git diff --quiet -- docs/articles.json docs/word-bank.json; then
            echo "No content change"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/articles.json docs/word-bank.json
          git commit -m "content: monthly reading package"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy the updated package to GitHub Pages
        if: steps.content_commit.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main
