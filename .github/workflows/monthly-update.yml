name: Monthly content update

on:
  workflow_dispatch:
    inputs:
      target_count:
        description: "Number of articles for a manual test/update"
        required: true
        default: "3"
  schedule:
    - cron: "20 2 1 * *"

permissions:
  contents: write
  models: read

concurrency:
  group: monthly-content-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      MINIMAX_BASE_URL: ${{ vars.MINIMAX_BASE_URL || 'https://api.minimaxi.com/v1' }}
      MINIMAX_MODEL: ${{ vars.MINIMAX_MODEL || 'MiniMax-M2.5' }}
      GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_MODELS_MODEL: ${{ vars.GITHUB_MODELS_MODEL || 'openai/gpt-4o-mini' }}
      SEARCH_PROVIDER: bing-rss
      TARGET_ARTICLE_COUNT: ${{ github.event_name == 'schedule' && '30' || inputs.target_count }}
      MAX_SEARCH_RESULTS: ${{ github.event_name == 'schedule' && '80' || '20' }}
      OUTPUT_PATH: ../docs/articles.json
      WORD_BANK_PATH: ../docs/word-bank.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ensure MiniMax secret exists
        shell: bash
        run: |
          if [ -z "$MINIMAX_API_KEY" ]; then
            echo "::error::Repository secret MINIMAX_API_KEY is missing"
            exit 1
          fi

      - name: Generate and validate monthly package
        working-directory: updater
        run: |
          node src/run.mjs
          node src/check.mjs ../docs/articles.json ../docs/word-bank.json

      - name: Commit the validated package
        shell: bash
        run: |
          if git diff --quiet -- docs/articles.json docs/word-bank.json; then
            echo "No content change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/articles.json docs/word-bank.json
          git commit -m "content: monthly reading package"
          git push
