name: Verify content refill trigger

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger one protected 30-article refill
        env:
          CONTENT_REFILL_URL: ${{ vars.CONTENT_REFILL_URL }}
          CONTENT_REFILL_TOKEN: ${{ vars.CONTENT_REFILL_TOKEN }}
        shell: bash
        run: |
          test -n "$CONTENT_REFILL_URL"
          test -n "$CONTENT_REFILL_TOKEN"
          curl --fail --show-error --silent \
            --retry 3 --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer $CONTENT_REFILL_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"unreadCount":0,"requestedCount":30,"source":"github-smoke"}' \
            "$CONTENT_REFILL_URL"
